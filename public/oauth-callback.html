<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Connecting…</title>
  </head>
  <body>
    <script>
      // Google's implicit flow returns the token in this page's own URL fragment, e.g.
      // #access_token=...&expires_in=3599&state=...&token_type=Bearer (or &error=... if
      // denied/failed). Hand it to the app via localStorage, then return to the app — kept
      // as a separate static page (not part of the SPA's hash-based router) so this never
      // collides with the app's own "#/route" hashes.
      // NOTE: the storage key here must match PENDING_TOKEN_KEY in src/lib/googleAuth.ts —
      // this file is plain, unbuilt HTML/JS, so it can't import that constant.
      (function () {
        var params = new URLSearchParams(location.hash.replace(/^#/, ''));
        var expiresIn = params.get('expires_in');
        var payload = {
          token: params.get('access_token') || undefined,
          expiresAt: expiresIn ? Date.now() + Number(expiresIn) * 1000 : undefined,
          state: params.get('state') || undefined,
          error: params.get('error') || undefined,
        };
        try {
          localStorage.setItem('gdrive-pending-token', JSON.stringify(payload));
        } catch (e) {
          /* storage unavailable */
        }
        location.href = './';
      })();
    </script>
  </body>
</html>
